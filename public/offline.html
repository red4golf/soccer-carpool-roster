<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — Soccer Carpool</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f2e9;color:#102a2a;
       font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;text-align:center;padding:24px}
  .card{max-width:26rem}
  h1{font-size:1.5rem;margin:.5rem 0}
  p{color:#667573;line-height:1.5}
  button{margin-top:1rem;min-height:48px;padding:0 24px;border:0;border-radius:12px;
         background:#178f58;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
</style>
<div class="card">
  <div style="font-size:3rem" aria-hidden="true">📴</div>
  <h1>No connection</h1>
  <p>The carpool board needs a signal to show who is driving. Your saved trips will reappear as soon as you are back online.</p>
  <button onclick="location.reload()">Try again</button>
</div>
