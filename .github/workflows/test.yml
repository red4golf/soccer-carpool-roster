name: Tests
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step: the suite runs on the Node standard library alone
      # (node:test + node:sqlite), so there is nothing to audit or pin.
      - name: Run tests
        run: node --test test/*.test.js
