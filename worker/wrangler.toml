name = "soccer-carpool"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Serve on the account's workers.dev subdomain. Explicit so a future config
# change cannot silently take the API offline.
workers_dev = true

# Free-tier sizing note: Workers allows 100k requests/day and D1 allows 5 GB
# with 5M row-reads/day. A 300-family club generating ~5k requests/day uses
# roughly 5% of that, so the whole thing runs at no cost.

[[d1_databases]]
binding = "DB"
database_name = "carpool"
# Created 2026-08-22 in region WNAM.
database_id = "61938c9e-e221-4e43-b696-2b125b5679ab"

[vars]
# Firebase project that mints the ID tokens. Not a secret — it appears in the
# client config too — but it MUST match, because the audience check is what
# stops a token from another Firebase project being accepted here.
FIREBASE_PROJECT_ID = "soccer-rideshare"

# Explicit CORS allowlist. Never a wildcard: these endpoints carry
# credentials, and `*` would make the whole board readable from any origin.
ALLOWED_ORIGINS = "https://red4golf.github.io,http://localhost:8788"

# Optional. With no key the router falls back to straight-line distance,
# which costs nothing and needs no network. Set it with:
#   wrangler secret put ORS_API_KEY
# ORS_API_KEY is read from secrets, not from here.

[observability]
enabled = true
